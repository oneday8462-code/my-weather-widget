<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 위젯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: transparent !important;
}

body {
  padding: 8px;
  color: #172b4d;
  font-family: Inter, 'Noto Sans KR', sans-serif;
}

/* 확대/축소 트릭 없이 컨테이너 폭에 맞춰 반응형으로 표시 */
.weather-app {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.weather-card {
  position: relative;
  width: 100%;
  overflow: hidden;
  padding: clamp(12px, 1.7vw, 18px);
  background: #fff;
  border: 1.5px solid #b9d8ff;
  border-radius: 19px;
  box-shadow: none;
}

/* 상단 도시명 / 업데이트 */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #d5e5fb;
}

.location-area {
  position: relative;
  display: flex;
  align-items: center;
  min-width: 0;
}

.city-trigger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  color: #172b4d;
  font: inherit;
  font-size: clamp(19px, 2.8vw, 27px);
  font-weight: 700;
  cursor: pointer;
}

.pin-icon {
  flex: 0 0 auto;
  width: 21px;
  height: 26px;
  fill: #2694ed;
}

.city-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.updated {
  flex: 0 0 auto;
  color: #526789;
  font-size: clamp(10px, 1.3vw, 12px);
  text-align: right;
}

.search-panel {
  display: none;
  position: absolute;
  z-index: 20;
  top: calc(100% + 10px);
  left: 0;
  width: min(340px, 85vw);
  padding: 12px;
  border: 1px solid #d7e5f6;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 8px 24px rgba(36, 68, 112, .16);
}

.search-panel.open { display: block; }

.search-input-row {
  display: flex;
  gap: 6px;
}

.search-input-row input {
  width: 100%;
  min-width: 0;
  padding: 10px 11px;
  border: 1px solid #cbdcf1;
  border-radius: 9px;
  outline: none;
  color: #203653;
  font: inherit;
  font-size: 14px;
}

.search-input-row input:focus {
  border-color: #6ca9ed;
}

.search-input-row button {
  flex: 0 0 auto;
  padding: 0 13px;
  border: 0;
  border-radius: 9px;
  background: #eaf3ff;
  color: #285b96;
  font: inherit;
  cursor: pointer;
}

.search-results {
  display: none;
  max-height: 220px;
  margin-top: 8px;
  overflow-y: auto;
}

.search-results.show { display: block; }

.search-results button {
  display: block;
  width: 100%;
  padding: 10px;
  border: 0;
  border-bottom: 1px solid #edf2f8;
  background: #fff;
  color: #263b59;
  text-align: left;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.search-results button:hover { background: #f2f7ff; }

/* 현재 날씨 */
.current-weather {
  display: grid;
  grid-template-columns: minmax(72px, 1fr) minmax(110px, 1.15fr) minmax(145px, 1.25fr);
  align-items: center;
  gap: clamp(9px, 1.6vw, 17px);
  padding: clamp(14px, 2vw, 21px) 5px;
}

.current-icon-area {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.current-icon svg {
  display: block;
  width: clamp(54px, 7.2vw, 80px);
  height: clamp(54px, 7.2vw, 80px);
}

.current-main { min-width: 0; }

.temperature {
  color: #172b4d;
  font-size: clamp(34px, 5.2vw, 54px);
  font-weight: 600;
  letter-spacing: -2px;
  line-height: 1.05;
  white-space: nowrap;
}

.condition {
  margin-top: 5px;
  color: #233b5d;
  font-size: clamp(13px, 1.8vw, 17px);
  font-weight: 500;
}

.weather-details {
  display: grid;
  gap: 8px;
  padding-left: clamp(10px, 1.7vw, 18px);
  border-left: 1px solid #b9d5fa;
}

.detail-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #233b5d;
  font-size: clamp(11px, 1.5vw, 14px);
  white-space: nowrap;
}

.detail-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 21px;
  width: 21px;
  height: 21px;
  color: #233b5d;
}

.detail-icon svg {
  display: block;
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.detail-value { font-weight: 500; }

/* 시간별 예보 */
.hourly-section {
  position: relative;
  padding: 11px 8px;
  border-radius: 14px;
  background: #f0f5fd;
}

.hourly-list {
  display: flex;
  width: 100%;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #cbdcf1 transparent;
}

.hour-item {
  flex: 0 0 16.6667%;
  min-width: 66px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 3px 5px;
  text-align: center;
}

.hour-item + .hour-item {
  border-left: 1px solid #d5e3f5;
}

.hour-time {
  color: #526789;
  font-size: clamp(11px, 1.4vw, 14px);
  white-space: nowrap;
}

.hour-icon svg {
  display: block;
  width: clamp(24px, 3vw, 34px);
  height: clamp(24px, 3vw, 34px);
}

.hour-temp {
  color: #172b4d;
  font-size: clamp(13px, 1.6vw, 16px);
  font-weight: 600;
  white-space: nowrap;
}

.hourly-hint {
  display: none;
  margin-top: 8px;
  color: #8192aa;
  font-size: 11px;
  text-align: center;
}

/* 주간 예보 */
.weekly-section {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid #d5e5fb;
}

.weekly-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: #cbdcf1 transparent;
  padding-bottom: 4px;
}

.weekly-list {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-width: 490px;
}

.week-row {
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 5px 6px;
  text-align: center;
}

.week-row + .week-row {
  border-left: 1px solid #cbdcf1;
}

.week-date {
  color: #203653;
  font-size: clamp(10px, 1.35vw, 13px);
  font-weight: 500;
  line-height: 1.45;
  white-space: nowrap;
}

.week-icon svg {
  display: block;
  width: clamp(26px, 3.2vw, 38px);
  height: clamp(26px, 3.2vw, 38px);
}

.week-temperatures {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 5px;
  white-space: nowrap;
}

.week-high {
  color: #203653;
  font-size: clamp(12px, 1.5vw, 16px);
  font-weight: 700;
}

.week-low {
  color: #687d99;
  font-size: clamp(11px, 1.4vw, 15px);
  font-weight: 400;
}

.status-message {
  padding: 16px;
  color: #71829a;
  font-size: 13px;
  text-align: center;
}


@media (min-width: 621px) and (max-width: 850px) {
  .current-weather {
    grid-template-columns: minmax(62px, .8fr) minmax(100px, 1fr) minmax(135px, 1.2fr);
    gap: 10px;
  }
  .detail-row { gap: 6px; }
}

@media (max-width: 620px) {
  body { padding: 5px; }

  .weather-card {
    padding: 12px;
    border-radius: 16px;
  }

  .header { padding-bottom: 9px; }
  .city-trigger { gap: 6px; font-size: clamp(17px, 5vw, 22px); }
  .pin-icon { width: 19px; height: 23px; }
  .updated { font-size: 9px; }

  .current-weather {
    grid-template-columns: 58px minmax(85px, 1fr);
    gap: 9px;
    padding: 14px 1px;
  }

  .current-icon svg { width: 54px; height: 54px; }
  .temperature { font-size: clamp(32px, 9vw, 43px); letter-spacing: -1.5px; }
  .condition { margin-top: 3px; font-size: 12px; }

  .weather-details {
    grid-column: 1 / -1;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px;
    padding: 9px 0 0;
    border-left: 0;
    border-top: 1px solid #d5e5fb;
  }

  .detail-row {
    flex-direction: column;
    gap: 3px;
    font-size: 10px;
    white-space: normal;
    text-align: center;
  }

  .detail-icon {
    flex-basis: 18px;
    width: 18px;
    height: 18px;
  }

  .detail-icon svg { width: 17px; height: 17px; }

  .hourly-section {
    margin: 0;
    padding: 9px 5px;
    border-radius: 12px;
  }

  .hour-item {
    flex-basis: 25%;
    min-width: 60px;
    gap: 6px;
    padding: 3px;
  }

  .hour-time { font-size: 10px; }
  .hour-icon svg { width: 25px; height: 25px; }
  .hour-temp { font-size: 12px; }

  .weekly-section {
    margin-top: 10px;
    padding-top: 9px;
  }

  .weekly-list { min-width: 455px; }
  .week-row { gap: 6px; padding: 3px 2px 5px; }
  .week-date { font-size: 10px; }
  .week-icon svg { width: 27px; height: 27px; }
  .week-temperatures { gap: 4px; }
  .week-high, .week-low { font-size: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .hourly-list { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div class="weather-app">
  <main class="weather-card">
    <header class="header">
      <div class="location-area">
        <button id="cityTrigger" class="city-trigger" type="button" aria-label="도시 검색 열기">
          <svg class="pin-icon" viewBox="0 0 24 32" aria-hidden="true">
            <path d="M12 0C5.4 0 0 5.4 0 12c0 8.4 12 20 12 20s12-11.6 12-20C24 5.4 18.6 0 12 0zm0 16.2a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4z"/>
          </svg>
          <span id="cityName" class="city-name">날씨 불러오는 중</span>
        </button>
        <div id="searchPanel" class="search-panel">
          <div class="search-input-row">
            <input id="citySearch" type="text" placeholder="도시 이름 검색" autocomplete="off">
            <button id="searchBtn" type="button">검색</button>
          </div>
          <div id="searchResults" class="search-results"></div>
        </div>
      </div>
      <div id="updated" class="updated">업데이트 확인 중</div>
    </header>

    <section class="current-weather" aria-label="현재 날씨">
      <div class="current-icon-area">
        <div id="currentIcon" class="current-icon"></div>
      </div>
      <div class="current-main">
        <div id="temperature" class="temperature">--°C</div>
        <div id="condition" class="condition">날씨 정보를 불러오는 중</div>
      </div>
      <div class="weather-details">
        <div class="detail-row">
          <span class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14 14.8V5a3 3 0 0 0-6 0v9.8a5 5 0 1 0 6 0Z"/><path d="M11 8v9"/><path d="M11 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
          </span>
          <span>체감온도</span>
          <span id="feelsLike" class="detail-value">--°C</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5Z"/><path d="M9 15.5a3 3 0 0 0 3 3"/></svg>
          </span>
          <span>습도</span>
          <span id="humidity" class="detail-value">--%</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 8h12a3 3 0 1 0-3-3"/><path d="M2 12h17a2.5 2.5 0 1 1-2.5 2.5"/><path d="M4 16h7a2.5 2.5 0 1 1-2.5 2.5"/></svg>
          </span>
          <span>바람</span>
          <span id="wind" class="detail-value">-- m/s</span>
        </div>
      </div>
    </section>

    <section class="hourly-section" aria-label="시간별 예보">
      <div id="hourly" class="hourly-list">
        <div class="status-message">시간별 예보를 불러오는 중입니다.</div>
      </div>
      <div class="hourly-hint">좌우로 밀어서 시간별 예보 확인</div>
    </section>

    <section class="weekly-section" aria-label="7일 예보">
      <div class="weekly-scroll">
        <div id="weekly" class="weekly-list">
          <div class="status-message">주간 예보를 불러오는 중입니다.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const geoAPI = 'https://geocoding-api.open-meteo.com/v1/search';
const weatherAPI = 'https://api.open-meteo.com/v1/forecast';
const $ = id => document.getElementById(id);

const citySettings = {
  Seoul: { name: '서울', lat: 37.5665, lon: 126.9780 },
  Busan: { name: '부산', lat: 35.1796, lon: 129.0756 },
  Gangneung: { name: '강릉', lat: 37.7514, lon: 128.8909 },
  Jeju: { name: '제주도', lat: 33.4996, lon: 126.5312 },
  Ansan: { name: '안산', lat: 37.3219, lon: 126.8309 },
  Jeonju: { name: '전주', lat: 35.8242, lon: 127.1480 },
  Ganghwa: { name: '강화도', lat: 37.7073, lon: 126.4463 },
  Sancheong: { name: '산청', lat: 35.4129, lon: 127.8791 },
  Tokyo: { name: '도쿄', lat: 35.6895, lon: 139.6917 },
  Osaka: { name: '오사카', lat: 34.6938, lon: 135.5011 },
  Kyoto: { name: '교토', lat: 35.0211, lon: 135.7539 },
  Nagoya: { name: '나고야', lat: 35.1815, lon: 136.9064 },
  Fukuoka: { name: '후쿠오카', lat: 33.6000, lon: 130.4167 },
  Taipei: { name: '타이베이', lat: 25.0330, lon: 121.5654 },
  Taichung: { name: '타이중', lat: 24.1477, lon: 120.6736 },
  Tainan: { name: '타이난', lat: 22.9997, lon: 120.2270 },
  Kaohsiung: { name: '가오슝', lat: 22.6273, lon: 120.3014 }
};

const weatherTypes = {
  0: ['맑음', 'sun'],
  1: ['대체로 맑음', 'partly'],
  2: ['구름 조금', 'partly'],
  3: ['흐림', 'cloud'],
  45: ['안개', 'fog'],
  48: ['짙은 안개', 'fog'],
  51: ['약한 이슬비', 'rain'],
  53: ['이슬비', 'rain'],
  55: ['강한 이슬비', 'rain'],
  56: ['어는 이슬비', 'rain'],
  57: ['강한 어는 이슬비', 'rain'],
  61: ['약한 비', 'rain'],
  63: ['비', 'rain'],
  65: ['강한 비', 'rain'],
  66: ['어는 비', 'rain'],
  67: ['강한 어는 비', 'rain'],
  71: ['약한 눈', 'snow'],
  73: ['눈', 'snow'],
  75: ['강한 눈', 'snow'],
  77: ['싸락눈', 'snow'],
  80: ['소나기', 'rain'],
  81: ['강한 소나기', 'rain'],
  82: ['폭우', 'rain'],
  85: ['눈 소나기', 'snow'],
  86: ['강한 눈 소나기', 'snow'],
  95: ['뇌우', 'storm'],
  96: ['우박 동반 뇌우', 'storm'],
  99: ['강한 뇌우', 'storm']
};

/* 기존 index.html의 SVG 날씨 아이콘 디자인 유지 */
function iconSvg(type, size = 28) {
  const iconColors = {
    sun: '#F5A642',
    partly: '#F5A642',
    cloud: '#A5AAB3',
    rain: '#579BEF',
    snow: '#79B9E9',
    fog: '#A5AAB3',
    storm: '#7B83C9',
    moon: '#EFCB58',
    nightCloud: '#EFCB58'
  };
  const color = iconColors[type] || '#A5AAB3';
  const common = `fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
  const shapes = {
    sun: `
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>
    `,
    partly: `
      <g stroke="#F5A642">
        <path d="M15.5 5.2A5.5 5.5 0 0 0 6 10"/>
        <path d="M15.5 1.5v2 M21 6h-2 M19.4 2.6 18 4"/>
      </g>
      <g stroke="#A5AAB3">
        <path d="M7 19h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 12 3.6 3.6 0 0 0 7 19Z"/>
      </g>
    `,
    cloud: `
      <path d="M6.5 19h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 19Z"/>
    `,
    rain: `
      <g stroke="#A5AAB3">
        <path d="M6.5 15h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 15Z"/>
      </g>
      <g stroke="#579BEF">
        <path d="m8 18-1 3 M13 18l-1 3 M18 18l-1 3"/>
      </g>
    `,
    snow: `
      <g stroke="#A5AAB3">
        <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      </g>
      <g stroke="#79B9E9">
        <path d="M8 18v4 M6.3 19l3.4 2 M9.7 19l-3.4 2 M16 18v4 M14.3 19l3.4 2 M17.7 19l-3.4 2"/>
      </g>
    `,
    fog: `
      <path d="M6 13h12a4 4 0 0 0 0-8 6 6 0 0 0-11 2 3 3 0 0 0-1 6Z"/>
      <path d="M3 17h18 M6 21h12"/>
    `,
    storm: `
      <g stroke="#A5AAB3">
        <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      </g>
      <g stroke="#E8B84A">
        <path d="m13 15-4 5h4l-1 4 5-7h-4l1-2"/>
      </g>
    `,
    moon: `
      <path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/>
    `,
    nightCloud: `
      <g stroke="#EFCB58">
        <path d="M18 4a5 5 0 0 0-6-2 6 6 0 0 1 2 7"/>
      </g>
      <g stroke="#A5AAB3">
        <path d="M6.5 20h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 13 3.5 3.5 0 0 0 6.5 20Z"/>
      </g>
    `
  };
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" ${common} aria-hidden="true">${shapes[type] || shapes.cloud}</svg>`;
}

function weatherInfo(code, isDay = 1) {
  const info = weatherTypes[code] || ['날씨 정보', 'cloud'];
  let type = info[1];
  if (type === 'sun' && !isDay) type = 'moon';
  if (type === 'partly' && !isDay) type = 'nightCloud';
  return { name: info[0], type };
}

function getInitialCity() {
  const key = decodeURIComponent(location.hash.slice(1)).trim() || 'Seoul';
  return citySettings[key] || citySettings.Seoul;
}

let currentCity = getInitialCity();

function toggleSearch(forceOpen) {
  const panel = $('searchPanel');
  const shouldOpen = typeof forceOpen === 'boolean'
    ? forceOpen
    : !panel.classList.contains('open');

  panel.classList.toggle('open', shouldOpen);
  if (shouldOpen) {
    $('citySearch').value = '';
    $('searchResults').classList.remove('show');
    setTimeout(() => $('citySearch').focus(), 0);
  }
}

async function searchCity() {
  const query = $('citySearch').value.trim();
  if (!query) return;

  $('searchResults').classList.add('show');
  $('searchResults').innerHTML = '<div class="status-message">도시를 검색하고 있습니다...</div>';

  try {
    const url = `${geoAPI}?name=${encodeURIComponent(query)}&count=10&language=ko&format=json`;
    const response = await fetch(url);
    if (!response.ok) throw new Error('Search failed');

    const data = await response.json();
    if (!data.results || !data.results.length) {
      $('searchResults').innerHTML = '<div class="status-message">검색 결과가 없습니다.</div>';
      return;
    }

    $('searchResults').innerHTML = '';
    data.results.forEach(place => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = [place.name, place.admin1, place.country].filter(Boolean).join(' · ');
      button.addEventListener('click', () => {
        const city = {
          name: place.name,
          lat: place.latitude,
          lon: place.longitude
        };
        toggleSearch(false);
        loadWeather(city);
      });
      $('searchResults').appendChild(button);
    });
  } catch (error) {
    $('searchResults').innerHTML = '<div class="status-message">검색에 실패했습니다. 다시 시도해 주세요.</div>';
  }
}

async function loadWeather(city) {
  currentCity = city;
  $('cityName').textContent = city.name;
  $('temperature').textContent = '--°C';
  $('condition').textContent = '날씨 정보를 불러오는 중';
  $('currentIcon').innerHTML = iconSvg('cloud', 100);
  $('hourly').innerHTML = '<div class="status-message">시간별 예보를 불러오는 중입니다.</div>';
  $('weekly').innerHTML = '<div class="status-message">주간 예보를 불러오는 중입니다.</div>';

  const params = new URLSearchParams({
    latitude: city.lat,
    longitude: city.lon,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day',
    hourly: 'temperature_2m,weather_code',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min',
    forecast_days: '7',
    timezone: 'auto'
  });

  try {
    const response = await fetch(`${weatherAPI}?${params}`);
    if (!response.ok) throw new Error('Weather API error');
    const data = await response.json();
    renderWeather(data, city.name);
  } catch (error) {
    $('condition').textContent = '날씨 정보를 불러오지 못했습니다.';
    $('hourly').innerHTML = '<div class="status-message">시간별 예보를 불러오지 못했습니다.</div>';
    $('weekly').innerHTML = '<div class="status-message">주간 예보를 불러오지 못했습니다.</div>';
  }
}

function renderWeather(data, cityName) {
  const current = data.current;
  const currentInfo = weatherInfo(current.weather_code, current.is_day);

  $('cityName').textContent = cityName;
  $('temperature').textContent = `${Math.round(current.temperature_2m)}°C`;
  $('condition').textContent = currentInfo.name;
  $('currentIcon').innerHTML = iconSvg(currentInfo.type, 110);
  $('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
  $('humidity').textContent = `${Math.round(current.relative_humidity_2m)}%`;
  $('wind').textContent = `${Number(current.wind_speed_10m).toFixed(1)} m/s`;

  // 시간별 예보: 현재 시각부터 최대 24시간
  const times = data.hourly.time;
  let startIndex = times.findIndex(time => time >= current.time);
  if (startIndex < 0) startIndex = 0;

  const hourlyHTML = [];
  for (let i = startIndex; i < Math.min(startIndex + 24, times.length); i++) {
    const hour = times[i].split('T')[1].slice(0, 5);
    const hourNumber = Number(hour.slice(0, 2));
    const isDay = hourNumber >= 6 && hourNumber < 18 ? 1 : 0;
    const info = weatherInfo(data.hourly.weather_code[i], isDay);

    hourlyHTML.push(`
      <div class="hour-item">
        <div class="hour-time">${hour}</div>
        <div class="hour-icon">${iconSvg(info.type, 44)}</div>
        <div class="hour-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
      </div>
    `);
  }
  $('hourly').innerHTML = hourlyHTML.join('');

  // 주간 예보: 오늘 포함 7일
  $('weekly').innerHTML = data.daily.time.slice(0, 7).map((date, index) => {
    const info = weatherInfo(data.daily.weather_code[index]);
    const dateObj = new Date(`${date}T12:00:00`);
    const month = dateObj.getMonth() + 1;
    const day = dateObj.getDate();
    const weekday = dateObj.toLocaleDateString('ko-KR', { weekday: 'short' });
    const dateLabel = `${month}/${day} ${weekday}`;

    return `
      <div class="week-row">
        <div class="week-date">${dateLabel}</div>
        <div class="week-icon">${iconSvg(info.type, 48)}</div>
        <div class="week-temperatures">
          <span class="week-high">${Math.round(data.daily.temperature_2m_max[index])}°</span>
          <span class="week-low">${Math.round(data.daily.temperature_2m_min[index])}°</span>
        </div>
      </div>
    `;
  }).join('');

  const localTime = current.time.split('T')[1] || '';
  $('updated').textContent = `⟳ 마지막 업데이트: ${localTime.slice(0, 5)}`;
}

// 도시명 클릭 → 검색창 열기
$('cityTrigger').addEventListener('click', () => toggleSearch());
$('searchBtn').addEventListener('click', searchCity);
$('citySearch').addEventListener('keydown', event => {
  if (event.key === 'Enter') searchCity();
  if (event.key === 'Escape') toggleSearch(false);
});

// 검색 패널 바깥을 누르면 닫기
document.addEventListener('click', event => {
  if (!event.target.closest('.location-area')) toggleSearch(false);
});

// 기존 URL 해시 도시 전환 기능 유지
window.addEventListener('hashchange', () => {
  const key = decodeURIComponent(location.hash.slice(1)).trim();
  const city = citySettings[key];
  if (city) loadWeather(city);
});

// 초기 실행
loadWeather(currentCity);
</script>

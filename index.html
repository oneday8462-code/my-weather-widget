
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 위젯</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
}

html {
  background: transparent !important;
}

body {
  margin: 0;
  padding: 10px;
  background: transparent !important;
  color: #172033;
  font-family: Inter, 'Noto Sans KR', sans-serif;
}

.weather-app {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.weather-card {
  width: 100%;
  overflow: hidden;
  background: #fff;
  border-radius: 25px;
  border: 1px solid #dce8f5;
  box-shadow: none;
}

.weather-top {
  position: relative;
  padding: clamp(18px, 5vw, 27px);
  background: linear-gradient(145deg, #fafaff, #f0f1ff);
}

.location-area {
  display: flex;
  align-items: center;
  gap: 10px;
}

.location-control {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
}

.location-control input {
  width: 100%;
  max-width: 180px;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: #536079;
  font-size: 16px;
  font-family: inherit;
}

.location-control button {
  border: none;
  background: transparent;
  color: #7180ff;
  font-size: 25px;
  cursor: pointer;
}

.search-results {
  display: none;
  position: absolute;
  z-index: 10;
  top: 65px;
  left: 25px;
  right: 25px;
  max-height: 220px;
  overflow-y: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(30,40,80,.15);
}

.search-results button {
  display: block;
  width: 100%;
  padding: 12px 15px;
  border: 0;
  border-bottom: 1px solid #eee;
  background: white;
  color: #26334a;
  text-align: left;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}

.search-results button:hover {
  background: #f1f2ff;
}

.current-weather {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 120px;
  gap: 10px;
}

.temperature {
  font-size: clamp(39px, 10vw, 49px);
  font-weight: 400;
  letter-spacing: -2px;
  white-space: nowrap;
}

.feels-like {
  margin-top: 5px;
  color: #8992a7;
  font-size: 12px;
}

.current-icon-area {
  min-width: 90px;
  text-align: center;
}

.current-icon svg {
  display: block;
  width: 65px;
  height: 65px;
  margin: auto;
}

.condition {
  margin-top: 7px;
  color: #66738e;
  font-size: 14px;
}

.hourly-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  border-top: 1px solid #e8eef5;
  padding-top: 18px;
  margin-top: 18px;
}

.hourly-list {
  display: flex;
  flex: 1;
  gap: 17px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
  padding: 2px 0 5px;
}

.hourly-list::-webkit-scrollbar {
  display: none;
}

.hour-item {
  flex: 0 0 43px;
  text-align: center;
}

.hour-time {
  color: #6c7892;
  font-size: 12px;
  white-space: nowrap;
}

.hour-icon {
  height: 30px;
  margin: 9px 0 6px;
}

.hour-icon svg {
  width: 25px;
  height: 25px;
}

.hour-temp {
  font-size: 13px;
  font-weight: 500;
}

.hour-arrow {
  position: absolute;
  z-index: 2;
  top: 50%;
  transform: translateY(-50%);
  width: 25px;
  height: 35px;
  padding: 0;
  border: 0;
  background: rgba(240,241,255,.9);
  color: #7180ff;
  font-size: 29px;
  line-height: 1;
  cursor: pointer;
}

.hour-arrow.left {
  left: -17px;
}

.hour-arrow.right {
  right: -17px;
}

.hour-arrow:disabled {
  opacity: .2;
  cursor: default;
}

/* 주간 예보: 7일 가로형 */
.weekly-section {
  border-top: 1px solid #e8eef5;
  padding-top: 18px;
  margin-top: 18px;
  padding: 22px clamp(18px, 5vw, 27px) 14px;
}

.weekly-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
  scrollbar-color: #dfe2f1 transparent;
  padding-bottom: 7px;
}

.weekly-list {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  min-width: 448px;
  gap: 5px;
}

.week-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-width: 0;
  gap: 10px;
  padding: 10px 3px;
  border-radius: 0;
  background: transparent;
  text-align: center;
}

.week-date {
  color: #536079;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.week-icon {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 30px;
}

.week-icon svg {
  width: 25px;
  height: 25px;
}

.week-temperatures {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.week-high {
  color: #27344b;
  font-size: 12px;
  font-weight: 600;
}

.week-low {
  color: #929caf;
  font-size: 12px;
  font-weight: 400;
}

.updated {
  padding: 0 20px 15px;
  color: #a0a7b6;
  text-align: right;
  font-size: 10px;
}

@media(max-width: 380px) {
  body {
    padding: 5px;
  }

  .weather-card {
    border-radius: 19px;
  }

  .hourly-list {
    gap: 12px;
  }

  .hour-item {
    flex-basis: 40px;
  }

  .weekly-list {
    min-width: 448px;
  }
}
</style>
</head>

<body>
<div class="weather-app">
  <div class="weather-card">

    <section class="weather-top">
<div class="location-area">
  <div class="location-control">
    <input id="citySearch" placeholder="도시 검색">
    <button id="searchBtn" aria-label="지역 검색">⌕</button>
  </div>
</div>

<div id="searchResults" class="search-results"></div>

      <div class="current-weather">
        <div>
          <div id="temperature" class="temperature">--°C</div>
          <div id="feelsLike" class="feels-like">체감온도 --°C</div>
        </div>
        <div class="current-icon-area">
          <div id="currentIcon" class="current-icon"></div>
          <div id="condition" class="condition">날씨 정보를 불러오는 중</div>
        </div>
      </div>

      <div class="hourly-wrapper">
        <button id="hourLeft" class="hour-arrow left" aria-label="이전 시간">‹</button>
        <div id="hourly" class="hourly-list"></div>
        <button id="hourRight" class="hour-arrow right" aria-label="다음 시간">›</button>
      </div>
    </section>

    <section class="weekly-section">
      <div class="weekly-scroll">
        <div id="weekly" class="weekly-list"></div>
      </div>
    </section>

    <div id="updated" class="updated"></div>
  </div>
</div>

<script>
const geoAPI = 'https://geocoding-api.open-meteo.com/v1/search';
const weatherAPI = 'https://api.open-meteo.com/v1/forecast';

const $ = id => document.getElementById(id);


const citySettings = {
  // 🇰🇷 한국
  Seoul: {
    name: '서울',
    lat: 37.5665,
    lon: 126.9780
  },
  Busan: {
    name: '부산',
    lat: 35.1796,
    lon: 129.0756
  },
  Gangneung: {
    name: '강릉',
    lat: 37.7514,
    lon: 128.8909
  },
  Jeju: {
    name: '제주도',
    lat: 33.4996,
    lon: 126.5312
  },
  Ansan: {
    name: '안산',
    lat: 37.3219,
    lon: 126.8309
  },
  Jeonju: {
    name: '전주',
    lat: 35.8242,
    lon: 127.1480
  },
  Ganghwa: {
    name: '강화도',
    lat: 37.7073,
    lon: 126.4463
  },
  Sancheong: {
    name: '산청',
    lat: 35.4129,
    lon: 127.8791
  },

  // 🇯🇵 일본
  Tokyo: {
    name: '도쿄',
    lat: 35.6895,
    lon: 139.6917
  },
  Osaka: {
    name: '오사카',
    lat: 34.6938,
    lon: 135.5011
  },
  Kyoto: {
    name: '교토',
    lat: 35.0211,
    lon: 135.7539
  },
  Nagoya: {
    name: '나고야',
    lat: 35.1815,
    lon: 136.9064
  },
  Fukuoka: {
    name: '후쿠오카',
    lat: 33.6000,
    lon: 130.4167
  },

  // 🇹🇼 대만
  Taipei: {
    name: '타이베이',
    lat: 25.0330,
    lon: 121.5654
  },
  Taichung: {
    name: '타이중',
    lat: 24.1477,
    lon: 120.6736
  },
  Tainan: {
    name: '타이난',
    lat: 22.9997,
    lon: 120.2270
  },
  Kaohsiung: {
    name: '가오슝',
    lat: 22.6273,
    lon: 120.3014
  }
};

const cityKey = decodeURIComponent(
  window.location.hash.slice(1)
).trim() || 'Seoul';

let currentCity = citySettings[cityKey] || citySettings.Seoul;

const weatherTypes = {
  0: ['맑음', 'sun'],
  1: ['대체로 맑음', 'partly'],
  2: ['구름 조금', 'partly'],
  3: ['흐림', 'cloud'],
  45: ['안개', 'fog'],
  48: ['짙은 안개', 'fog'],
  51: ['약한 이슬비', 'rain'],
  53: ['이슬비', 'rain'],
  55: ['강한 이슬비', 'rain'],
  56: ['어는 이슬비', 'rain'],
  57: ['강한 어는 이슬비', 'rain'],
  61: ['약한 비', 'rain'],
  63: ['비', 'rain'],
  65: ['강한 비', 'rain'],
  66: ['어는 비', 'rain'],
  67: ['강한 어는 비', 'rain'],
  71: ['약한 눈', 'snow'],
  73: ['눈', 'snow'],
  75: ['강한 눈', 'snow'],
  77: ['싸락눈', 'snow'],
  80: ['소나기', 'rain'],
  81: ['강한 소나기', 'rain'],
  82: ['폭우', 'rain'],
  85: ['눈 소나기', 'snow'],
  86: ['강한 눈 소나기', 'snow'],
  95: ['뇌우', 'storm'],
  96: ['우박 동반 뇌우', 'storm'],
  99: ['강한 뇌우', 'storm']
};

// 날씨 아이콘
function iconSvg(type, size = 28) {
  const iconColors = {
    sun: '#F5A642',
    partly: '#F5A642',
    cloud: '#A5AAB3',
    rain: '#579BEF',
    snow: '#79B9E9',
    fog: '#A5AAB3',
    storm: '#7B83C9',
    moon: '#EFCB58',
    nightCloud: '#EFCB58'
  };

  const color = iconColors[type] || '#A5AAB3';

  const common = `fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;

  const shapes = {
    sun: `
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>
    `,
    partly: `
      <g stroke="#F5A642">
        <path d="M15.5 5.2A5.5 5.5 0 0 0 6 10"/>
        <path d="M15.5 1.5v2 M21 6h-2 M19.4 2.6 18 4"/>
      </g>
      <g stroke="#A5AAB3">
        <path d="M7 19h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 12 3.6 3.6 0 0 0 7 19Z"/>
      </g>
    `,
    cloud: `
      <path d="M6.5 19h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 19Z"/>
    `,
    rain: `
      <g stroke="#A5AAB3">
        <path d="M6.5 15h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 15Z"/>
      </g>
      <g stroke="#579BEF">
        <path d="m8 18-1 3 M13 18l-1 3 M18 18l-1 3"/>
      </g>
    `,
    snow: `
      <g stroke="#A5AAB3">
        <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      </g>
      <g stroke="#79B9E9">
        <path d="M8 18v4 M6.3 19l3.4 2 M9.7 19l-3.4 2 M16 18v4 M14.3 19l3.4 2 M17.7 19l-3.4 2"/>
      </g>
    `,
    fog: `
      <path d="M6 13h12a4 4 0 0 0 0-8 6 6 0 0 0-11 2 3 3 0 0 0-1 6Z"/>
      <path d="M3 17h18 M6 21h12"/>
    `,
    storm: `
      <g stroke="#A5AAB3">
        <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      </g>
      <g stroke="#E8B84A">
        <path d="m13 15-4 5h4l-1 4 5-7h-4l1-2"/>
      </g>
    `,
    moon: `
      <path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/>
    `,
    nightCloud: `
      <g stroke="#EFCB58">
        <path d="M18 4a5 5 0 0 0-6-2 6 6 0 0 1 2 7"/>
      </g>
      <g stroke="#A5AAB3">
        <path d="M6.5 20h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 13 3.5 3.5 0 0 0 6.5 20Z"/>
      </g>
    `
  };

  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" ${common}>${shapes[type] || shapes.cloud}</svg>`;
}

function weatherInfo(code, isDay = 1) {
  const info = weatherTypes[code] || ['날씨 정보', 'cloud'];
  let type = info[1];

  if (type === 'sun' && !isDay) type = 'moon';
  if (type === 'partly' && !isDay) type = 'nightCloud';

  return { name: info[0], type };
}

// 지역 검색
async function searchCity() {
  const query = $('citySearch').value.trim();
  if (!query) return;

  $('searchResults').style.display = 'block';
  $('searchResults').innerHTML =
    '<button disabled>지역 검색 중...</button>';

  try {
    const url =
      `${geoAPI}?name=${encodeURIComponent(query)}&count=10&language=ko&format=json`;

    const response = await fetch(url);
    if (!response.ok) throw new Error('Search failed');

    const data = await response.json();

    if (!data.results?.length) {
      $('searchResults').innerHTML =
        '<button disabled>검색 결과가 없습니다.</button>';
      return;
    }

    $('searchResults').innerHTML = '';

    data.results.forEach(place => {
      const btn = document.createElement('button');

      btn.textContent = [
        place.name,
        place.admin1,
        place.country
      ].filter(Boolean).join(' · ');

      btn.addEventListener('click', () => {
        $('searchResults').style.display = 'none';
        $('citySearch').value = place.name;

        loadWeather(
          place.latitude,
          place.longitude,
          place.name
        );
      });

      $('searchResults').appendChild(btn);
    });

  } catch (error) {
    $('searchResults').innerHTML =
      '<button disabled>검색에 실패했습니다. 다시 시도해 주세요.</button>';
  }
}

// 날씨 데이터 불러오기
async function loadWeather(lat, lon, city) {
  currentCity = { name: city, lat, lon };

  $('citySearch').value = city;
  $('temperature').textContent = '--°C';
  $('condition').textContent = '날씨 정보를 불러오는 중';
  $('currentIcon').innerHTML = iconSvg('cloud', 65);

  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'temperature_2m,apparent_temperature,weather_code,is_day',
    hourly: 'temperature_2m,weather_code',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min',
    forecast_days: 8,
    timezone: 'auto'
  });

  try {
    const response = await fetch(`${weatherAPI}?${params}`);

    if (!response.ok) throw new Error('Weather API error');

    const data = await response.json();

    renderWeather(data, city);

  } catch (error) {
    $('condition').textContent = '날씨 정보를 불러오지 못했습니다.';
    $('hourly').innerHTML = '';
    $('weekly').innerHTML = '';
  }
}

function renderWeather(data, city) {
  const current = data.current;
  const currentInfo = weatherInfo(
    current.weather_code,
    current.is_day
  );

  $('temperature').textContent =
    `${Math.round(current.temperature_2m)}°C`;

  $('feelsLike').textContent =
    `체감온도 ${Math.round(current.apparent_temperature)}°C`;

  $('currentIcon').innerHTML =
    iconSvg(currentInfo.type, 65);

  $('condition').textContent = currentInfo.name;

  // 시간별 예보
  const times = data.hourly.time;
  const now = current.time;

  let startIndex = times.findIndex(t => t >= now);
  if (startIndex < 0) startIndex = 0;

  const hourlyHTML = [];

  for (let i = startIndex; i < Math.min(startIndex + 24, times.length); i++) {
    const hour = times[i].split('T')[1].slice(0, 5);
    const hourNumber = Number(hour.slice(0, 2));

    const isDay = hourNumber >= 6 && hourNumber < 18;

    const info = weatherInfo(
      data.hourly.weather_code[i],
      isDay ? 1 : 0
    );

    hourlyHTML.push(`
      <div class="hour-item">
        <div class="hour-time">${hour}</div>
        <div class="hour-icon">${iconSvg(info.type, 25)}</div>
        <div class="hour-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
      </div>
    `);
  }

  $('hourly').innerHTML = hourlyHTML.join('');
  $('hourly').scrollLeft = 0;
  updateHourArrows();

  // 주간 예보: 오늘 제외, 이후 7일
  $('weekly').innerHTML = data.daily.time.slice(1, 8).map((date, index) => {
    const i = index + 1;
    const info = weatherInfo(data.daily.weather_code[i]);

    const dateObj = new Date(date + 'T12:00:00');
    const dateText = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
    const weekday = dateObj.toLocaleDateString('ko-KR', {
      weekday: 'short'
    });

    return `
      <div class="week-row">
        <div class="week-date">${dateText} ${weekday}</div>
        <div class="week-icon">${iconSvg(info.type, 25)}</div>
        <div class="week-temperatures">
          <span class="week-high">${Math.round(data.daily.temperature_2m_max[i])}°</span>
          <span class="week-low">${Math.round(data.daily.temperature_2m_min[i])}°</span>
        </div>
      </div>
    `;
  }).join('');

  $('updated').textContent =
    `${city} · 현지 시각 ${current.time.replace('T', ' ')}`;
}

// 시간별 예보 좌우 이동
function updateHourArrows() {
  const list = $('hourly');

  $('hourLeft').disabled = list.scrollLeft <= 2;
  $('hourRight').disabled =
    list.scrollLeft + list.clientWidth >= list.scrollWidth - 2;
}

$('hourLeft').addEventListener('click', () => {
  $('hourly').scrollBy({
    left: -180,
    behavior: 'smooth'
  });
});

$('hourRight').addEventListener('click', () => {
  $('hourly').scrollBy({
    left: 180,
    behavior: 'smooth'
  });
});

$('hourly').addEventListener('scroll', updateHourArrows);

window.addEventListener('resize', updateHourArrows);

// 버튼 이벤트
$('searchBtn').addEventListener('click', searchCity);

$('citySearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchCity();
});

// 바깥 영역을 누르면 검색 결과 닫기
document.addEventListener('click', e => {
  if (
    !e.target.closest('.location-area') &&
    !e.target.closest('.search-results')
  ) {
    $('searchResults').style.display = 'none';
  }
});

  // URL의 도시 코드가 변경되면 날씨 갱신
window.addEventListener('hashchange', () => {
  const cityKey = decodeURIComponent(
    window.location.hash.slice(1)
  ).trim();

  const city = citySettings[cityKey];

  if (!city) {
    $('condition').textContent = '등록되지 않은 도시입니다.';
    return;
  }

  $('citySearch').value = city.name;

  loadWeather(
    city.lat,
    city.lon,
    city.name
  );
});

// 초기 실행
$('citySearch').value = currentCity.name;

loadWeather(
  currentCity.lat,
  currentCity.lon,
  currentCity.name
);

</script>
</body>
</html>

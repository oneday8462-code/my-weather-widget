
<div class="weather-app">

<script>
const geoAPI = 'https://geocoding-api.open-meteo.com/v1/search';
const weatherAPI = 'https://api.open-meteo.com/v1/forecast';

const $ = id => document.getElementById(id);

let currentCity = {
  name: '도쿄',
  lat: 35.6762,
  lon: 139.6503
};

let favorites = [];
let searchTimer = null;

const weatherTypes = {
  0: ['맑음', 'sun'],
  1: ['대체로 맑음', 'partly'],
  2: ['구름 조금', 'partly'],
  3: ['흐림', 'cloud'],
  45: ['안개', 'fog'],
  48: ['짙은 안개', 'fog'],
  51: ['약한 이슬비', 'rain'],
  53: ['이슬비', 'rain'],
  55: ['강한 이슬비', 'rain'],
  56: ['어는 이슬비', 'rain'],
  57: ['강한 어는 이슬비', 'rain'],
  61: ['약한 비', 'rain'],
  63: ['비', 'rain'],
  65: ['강한 비', 'rain'],
  66: ['어는 비', 'rain'],
  67: ['강한 어는 비', 'rain'],
  71: ['약한 눈', 'snow'],
  73: ['눈', 'snow'],
  75: ['강한 눈', 'snow'],
  77: ['싸락눈', 'snow'],
  80: ['소나기', 'rain'],
  81: ['강한 소나기', 'rain'],
  82: ['폭우', 'rain'],
  85: ['눈 소나기', 'snow'],
  86: ['강한 눈 소나기', 'snow'],
  95: ['뇌우', 'storm'],
  96: ['우박 동반 뇌우', 'storm'],
  99: ['강한 뇌우', 'storm']
};

// 선형 SVG 아이콘
function iconSvg(type, size = 28) {
  const iconColors = {
  sun: '#F5A642',       // 해: 주황색
  partly: '#EBA94B',    // 구름 조금: 따뜻한 노랑
  cloud: '#A5AAB3',     // 구름: 회색
  rain: '#579BEF',      // 비: 파란색
  snow: '#79B9E9',      // 눈: 하늘색
  fog: '#A5AAB3',       // 안개: 회색
  storm: '#7B83C9',     // 뇌우: 보라색
  moon: '#EFCB58',      // 달: 노란색
  nightCloud: '#C3AD69' // 야간 구름: 차분한 노랑
};

const color = iconColors[type] || '#A5AAB3';

const common = `fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;

  const shapes = {
    sun: `
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>
    `,
    partly: `
      <path d="M15.5 5.2A5.5 5.5 0 0 0 6 10"/>
      <path d="M15.5 1.5v2 M21 6h-2 M19.4 2.6 18 4"/>
      <path d="M7 19h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 12 3.6 3.6 0 0 0 7 19Z"/>
    `,
    cloud: `
      <path d="M6.5 19h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 19Z"/>
    `,
    rain: `
      <path d="M6.5 15h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 15Z"/>
      <path d="m8 18-1 3 M13 18l-1 3 M18 18l-1 3"/>
    `,
    snow: `
      <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      <path d="M8 18v4 M6.3 19l3.4 2 M9.7 19l-3.4 2 M16 18v4 M14.3 19l3.4 2 M17.7 19l-3.4 2"/>
    `,
    fog: `
      <path d="M6 13h12a4 4 0 0 0 0-8 6 6 0 0 0-11 2 3 3 0 0 0-1 6Z"/>
      <path d="M3 17h18 M6 21h12"/>
    `,
    storm: `
      <path d="M6.5 14h11a4.5 4.5 0 0 0 .4-9 6.5 6.5 0 0 0-12.5 1A4 4 0 0 0 6.5 14Z"/>
      <path d="m13 15-4 5h4l-1 4 5-7h-4l1-2"/>
    `,
    moon: `
      <path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/>
    `,
    nightCloud: `
      <path d="M18 4a5 5 0 0 0-6-2 6 6 0 0 1 2 7"/>
      <path d="M6.5 20h11a4 4 0 0 0 .3-8A6.2 6.2 0 0 0 6.4 13 3.5 3.5 0 0 0 6.5 20Z"/>
    `
  };

  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" ${common} aria-hidden="true">${shapes[type] || shapes.cloud}</svg>`;
}

function weatherInfo(code, isDay = 1) {
  const info = weatherTypes[code] || ['날씨 정보', 'cloud'];
  let type = info[1];

  if (type === 'sun' && !isDay) type = 'moon';
  if (type === 'partly' && !isDay) type = 'nightCloud';

  return { name: info[0], type };
}

// 즐겨찾기 저장
function saveFavorites() {
  try {
    localStorage.setItem('myWeatherFavorites', JSON.stringify(favorites));
  } catch (e) {
    console.warn('즐겨찾기를 저장할 수 없습니다.', e);
  }
}

function loadFavorites() {
  try {
    favorites = JSON.parse(
      localStorage.getItem('myWeatherFavorites') || '[]'
    );

    if (!Array.isArray(favorites)) favorites = [];
  } catch (e) {
    favorites = [];
  }

  renderFavorites();
}

function renderFavorites() {
  const area = $('favoritesArea');
  const list = $('favoritesList');

  area.style.display = favorites.length ? 'block' : 'none';

  list.innerHTML = '';

  favorites.forEach((place, index) => {
    const chip = document.createElement('button');
    chip.className = 'favorite-chip';

    const isSelected =
      place.lat === currentCity.lat &&
      place.lon === currentCity.lon;

    if (isSelected) chip.classList.add('selected');

    const name = document.createElement('span');
    name.textContent = place.name;

    const remove = document.createElement('span');
    remove.className = 'remove-favorite';
    remove.textContent = '×';
    remove.title = '즐겨찾기 삭제';

    chip.appendChild(name);
    chip.appendChild(remove);

    chip.addEventListener('click', () => {
      loadWeather(place.lat, place.lon, place.name);
    });

    remove.addEventListener('click', e => {
      e.stopPropagation();
      favorites.splice(index, 1);
      saveFavorites();
      renderFavorites();
      updateFavoriteButton();
    });

    list.appendChild(chip);
  });
}

function updateFavoriteButton() {
  const exists = favorites.some(place =>
    place.lat === currentCity.lat &&
    place.lon === currentCity.lon
  );

  $('favoriteBtn').classList.toggle('active', exists);
  $('favoriteBtn').textContent = exists ? '★' : '☆';
  $('favoriteBtn').title = exists ? '즐겨찾기 삭제' : '즐겨찾기 추가';
}

function toggleFavorite() {
  const index = favorites.findIndex(place =>
    place.lat === currentCity.lat &&
    place.lon === currentCity.lon
  );

  if (index >= 0) {
    favorites.splice(index, 1);
  } else {
    favorites.push({
      name: currentCity.name,
      lat: currentCity.lat,
      lon: currentCity.lon
    });
  }

  saveFavorites();
  renderFavorites();
  updateFavoriteButton();
}

// 지역 검색
async function searchCity() {
  const query = $('citySearch').value.trim();
  if (!query) return;

  $('searchResults').style.display = 'block';
  $('searchResults').innerHTML =
    '<button disabled>지역 검색 중...</button>';

  try {
    const url =
      `${geoAPI}?name=${encodeURIComponent(query)}&count=10&language=ko&format=json`;

    const response = await fetch(url);
    if (!response.ok) throw new Error('Search failed');

    const data = await response.json();

    if (!data.results?.length) {
      $('searchResults').innerHTML =
        '<button disabled>검색 결과가 없습니다.</button>';
      return;
    }

    $('searchResults').innerHTML = '';

    data.results.forEach(place => {
      const btn = document.createElement('button');

      btn.textContent = [
        place.name,
        place.admin1,
        place.country
      ].filter(Boolean).join(' · ');

      btn.addEventListener('click', () => {
        $('searchResults').style.display = 'none';
        $('citySearch').value = place.name;

        loadWeather(
          place.latitude,
          place.longitude,
          place.name
        );
      });

      $('searchResults').appendChild(btn);
    });

  } catch (error) {
    $('searchResults').innerHTML =
      '<button disabled>검색에 실패했습니다. 다시 시도해 주세요.</button>';
  }
}

// 날씨 데이터 불러오기
async function loadWeather(lat, lon, city) {
  currentCity = { name: city, lat, lon };

  $('citySearch').value = city;
  $('temperature').textContent = '--°C';
  $('condition').textContent = '날씨 정보를 불러오는 중';
  $('currentIcon').innerHTML = iconSvg('cloud', 65);

  renderFavorites();
  updateFavoriteButton();

  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'temperature_2m,apparent_temperature,weather_code,is_day',
    hourly: 'temperature_2m,weather_code',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min',
    forecast_days: 8,
    timezone: 'auto'
  });

  try {
    const response = await fetch(`${weatherAPI}?${params}`);

    if (!response.ok) throw new Error('Weather API error');

    const data = await response.json();

    renderWeather(data, city);

  } catch (error) {
    $('condition').textContent = '날씨 정보를 불러오지 못했습니다.';
    $('hourly').innerHTML = '';
    $('weekly').innerHTML = '';
  }
}

function renderWeather(data, city) {
  const current = data.current;
  const currentInfo = weatherInfo(
    current.weather_code,
    current.is_day
  );

  $('temperature').textContent =
    `${Math.round(current.temperature_2m)}°C`;

  $('feelsLike').textContent =
    `체감온도 ${Math.round(current.apparent_temperature)}°C`;

  $('currentIcon').innerHTML =
    iconSvg(currentInfo.type, 65);

  $('condition').textContent = currentInfo.name;

  // 시간별 예보
  const times = data.hourly.time;
  const now = current.time;

  let startIndex = times.findIndex(t => t >= now);
  if (startIndex < 0) startIndex = 0;

  const hourlyHTML = [];

  for (let i = startIndex; i < Math.min(startIndex + 24, times.length); i++) {
    const hour = times[i].split('T')[1].slice(0, 5);
    const hourNumber = Number(hour.slice(0, 2));

    const isDay = hourNumber >= 6 && hourNumber < 18;

    const info = weatherInfo(
      data.hourly.weather_code[i],
      isDay ? 1 : 0
    );

    hourlyHTML.push(`
      <div class="hour-item">
        <div class="hour-time">${hour}</div>
        <div class="hour-icon">${iconSvg(info.type, 25)}</div>
        <div class="hour-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
      </div>
    `);
  }

  $('hourly').innerHTML = hourlyHTML.join('');
  $('hourly').scrollLeft = 0;
  updateHourArrows();

  // 주간 예보: 오늘 제외, 이후 7일
  $('weekly').innerHTML = data.daily.time.slice(1, 8).map((date, index) => {
    const i = index + 1;
    const info = weatherInfo(data.daily.weather_code[i]);

    const dateObj = new Date(date + 'T12:00:00');

    const dateText = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;

    const weekday = dateObj.toLocaleDateString('ko-KR', {
      weekday: 'short'
    });

    return `
      <div class="week-row">
        <div class="week-day">
          <span class="week-date">${dateText} ${weekday}</span>
        </div>
        <div class="week-icon">${iconSvg(info.type, 24)}</div>
        <div class="week-high">${Math.round(data.daily.temperature_2m_max[i])}°</div>
        <div class="week-low">${Math.round(data.daily.temperature_2m_min[i])}°</div>
      </div>
    `;
  }).join('');

  $('updated').textContent =
    `${city} · 현지 시각 ${current.time.replace('T', ' ')}`;
}

// 시간별 예보 좌우 이동
function updateHourArrows() {
  const list = $('hourly');

  $('hourLeft').disabled = list.scrollLeft <= 2;
  $('hourRight').disabled =
    list.scrollLeft + list.clientWidth >= list.scrollWidth - 2;
}

$('hourLeft').addEventListener('click', () => {
  $('hourly').scrollBy({
    left: -180,
    behavior: 'smooth'
  });
});

$('hourRight').addEventListener('click', () => {
  $('hourly').scrollBy({
    left: 180,
    behavior: 'smooth'
  });
});

$('hourly').addEventListener('scroll', updateHourArrows);

window.addEventListener('resize', updateHourArrows);

// 버튼 이벤트
$('searchBtn').addEventListener('click', searchCity);

$('citySearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchCity();
});

$('favoriteBtn').addEventListener('click', toggleFavorite);

document.addEventListener('click', e => {
  if (!e.target.closest('.location-area') &&
      !e.target.closest('.search-results')) {
    $('searchResults').style.display = 'none';
  }
});

// 초기 실행
loadFavorites();
loadWeather(35.6762, 139.6503, '도쿄');
</script>
